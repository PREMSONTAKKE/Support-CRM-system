services:
  - type: web
    name: support-crm-api
    env: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/PREMSONTAKKE/Support-CRM-system
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./support.db
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173

