services:
  - type: web
    name: support-crm-api
    runtime: python
    repo: https://github.com/PREMSONTAKKE/Support-CRM-system
    plan: free
    region: oregon
    rootDir: backend
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./support.db
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
